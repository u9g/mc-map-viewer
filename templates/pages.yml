# Publishes the built viewer to GitHub Pages.
#
# The site is committed, so this only uploads it — no Node, no build step, no
# world save in CI. Turn it on once in Settings -> Pages -> Source: GitHub
# Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['{{OUT}}/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish; publishing twice at once helps nobody.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '{{OUT}}'
      - id: deployment
        uses: actions/deploy-pages@v4
